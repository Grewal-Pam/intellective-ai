<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <style>
    .box { fill:#f8fafc; stroke:#0f172a; stroke-width:1.5; }
    .arrow { stroke:#0f172a; stroke-width:1.5; fill:none; marker-end: url(#arrowhead); }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#0f172a; }
    .small { font-size:12px; fill:#334155; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="40" width="160" height="56" rx="6" class="box" />
  <text x="120" y="70" text-anchor="middle" class="text">draft</text>

  <rect x="260" y="40" width="160" height="56" rx="6" class="box" />
  <text x="340" y="70" text-anchor="middle" class="text">in_review</text>

  <rect x="480" y="40" width="160" height="56" rx="6" class="box" />
  <text x="560" y="70" text-anchor="middle" class="text">approved</text>

  <rect x="260" y="140" width="160" height="56" rx="6" class="box" />
  <text x="340" y="170" text-anchor="middle" class="text">rejected</text>

  <rect x="480" y="140" width="160" height="56" rx="6" class="box" />
  <text x="560" y="170" text-anchor="middle" class="text">published</text>

  <rect x="40" y="240" width="200" height="56" rx="6" class="box" />
  <text x="140" y="270" text-anchor="middle" class="text">POST /generate</text>

  <rect x="320" y="240" width="200" height="56" rx="6" class="box" />
  <text x="420" y="270" text-anchor="middle" class="text">GET /metrics</text>

  <!-- Arrows -->
  <path d="M200,68 L260,68" class="arrow" />
  <path d="M420,68 L480,68" class="arrow" />
  <path d="M340,96 L340,140" class="arrow" />
  <path d="M340,196 L340,196 L120,196 L120,96" class="arrow" />
  <path d="M560,96 L560,140" class="arrow" />

  <path d="M240,268 L320,268" class="arrow" />
  <path d="M520,268 L640,268" class="arrow" />

  <!-- Labels -->
  <text x="340" y="110" text-anchor="middle" class="small">review decision</text>
  <text x="560" y="110" text-anchor="middle" class="small">publish (version)</text>
  <text x="120" y="110" text-anchor="middle" class="small">submit</text>

  <!-- Footer note -->
  <text x="400" y="340" text-anchor="middle" class="small">Runtime generation → model adapter; metrics & structured logs capture activity</text>
</svg>
